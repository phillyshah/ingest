rules:
  - key: req_side
    name: Operated side must be established
    kind: required_input
    expression: {op: known, field: affected_side}
    action: {type: require_field, field: affected_side, reason: "Laterality is not established"}
    severity: block
  - key: req_procedure
    name: Procedure, date and surgical approach are required
    kind: required_input
    expression: {op: and, args: [{op: known, field: procedure}, {op: known, field: procedure_date}, {op: known, field: surgical_approach}]}
    action: {type: require_field, fields: [procedure, procedure_date, surgical_approach], reason: "The approach decides which movements are restricted; it is never inferred"}
    severity: block
  - key: req_associated
    name: Associated procedures must be known
    kind: required_input
    expression: {op: known, field: associated_procedures}
    action: {type: require_field, field: associated_procedures, reason: "Revision, periprosthetic fracture or abductor repair are different pathways"}
    severity: block
  - key: req_surgeon_status
    name: Weight-bearing status, fixation and surgeon restrictions are required
    kind: required_input
    expression: {op: and, args: [{op: known, field: weight_bearing_status}, {op: known, field: fixation}, {op: known, field: surgeon_restrictions}, {op: known, field: rom_restrictions}]}
    action: {type: require_field, fields: [weight_bearing_status, fixation, surgeon_restrictions, rom_restrictions], reason: "Weight bearing and hip precautions are surgeon-set and never assumed"}
    severity: block
  - key: req_current_assessment
    name: Current assessment is required
    kind: required_input
    expression: {op: and, args: [{op: known, field: hip_flexion_active_deg}, {op: known, field: assistive_device}, {op: known, field: wound_status}, {op: known, field: pain_movement}, {op: known, field: concerning_findings}]}
    action: {type: require_field, fields: [hip_flexion_active_deg, assistive_device, wound_status, pain_movement, concerning_findings], reason: "Current hip measure, device, wound state and the concern screen are required"}
    severity: block
  - key: concern_findings_present
    name: Concerning findings reported
    kind: concern_screen
    expression: {op: and, args: [{op: known, field: concerning_findings}, {op: ne, field: concerning_findings, value: []}]}
    action: {type: block_for_review, message: "Concerning findings after a hip replacement (sudden hip pain with a short or turned-out leg, calf pain or swelling, fever, wound drainage, a fall) route to the surgeon or clinician per approved rule (unsigned)."}
    severity: block
  - key: wound_concern
    name: Wound concern reported
    kind: concern_screen
    expression: {op: eq, field: wound_status, value: concern}
    action: {type: block_for_review, message: "A wound concern is a surgeon question before any loading progression."}
    severity: block
  - key: combined_procedure
    name: Not a primary uncomplicated THA
    kind: restriction
    expression: {op: and, args: [{op: known, field: associated_procedures}, {op: ne, field: associated_procedures, value: []}]}
    action: {type: block_for_review, message: "Revision, periprosthetic fracture fixation or abductor repair are not merged with the primary pathway; a separate approved pathway is required."}
    severity: block
  - key: posterior_precautions
    name: Posterior approach precautions (executes only once signed)
    kind: restriction
    expression: {op: eq, field: surgical_approach, value: posterior}
    action: {type: exclude_variant, tags: [hip_flexion_over_90, adduction_past_midline, hip_internal_rotation]}
    severity: block
  - key: anterior_precautions
    name: Anterior approach precautions (executes only once signed)
    kind: restriction
    expression: {op: eq, field: surgical_approach, value: anterior}
    action: {type: exclude_variant, tags: [hip_extension_external_rotation, prone_hip_extension]}
    severity: block
  - key: lateral_precautions
    name: Lateral approach precautions (executes only once signed)
    kind: restriction
    expression: {op: eq, field: surgical_approach, value: lateral}
    action: {type: exclude_variant, tags: [active_hip_abduction]}
    severity: block
  - key: protected_weight_bearing
    name: Protected weight bearing excludes standing loaded work
    kind: restriction
    expression: {op: in, field: weight_bearing_status, value: [pwb, tdwb, nwb]}
    action: {type: exclude_variant, tags: [closed_chain, stairs]}
    severity: block
  - key: worsening_response
    name: Worsening response after prior session
    kind: next_day_response
    expression: {op: eq, field: prior_session_response, value: worse}
    action: {type: block_for_review, message: "Worsened response; routing requires an approved rule."}
    severity: block
  - key: branch_primary_tha
    name: Primary uncomplicated THA
    kind: eligibility
    expression: {op: and, args: [{op: eq, field: procedure, value: total_hip_arthroplasty}, {op: eq, field: associated_procedures, value: []}]}
    action: {type: inform, message: primary uncomplicated THA pathway}
  - key: phase_entry_criteria_slot
    name: Phase advancement criteria (RULE SLOT — unsigned)
    kind: progression
    expression: {op: eq, field: functional_criteria_met, value: true}
    action: {type: inform, message: "Advance only when PT-confirmed criteria are met; elapsed time is never a criterion on its own."}
  - key: earliest_start_slot
    name: Earliest phase start (RULE SLOT — floor unsigned)
    kind: progression
    expression: {op: known, field: days_since_procedure}
    action: {type: inform, message: "A signed rule will combine days_since_procedure with criteria as a floor; until signed this only confirms the date is known."}
  - key: precaution_duration_slot
    name: Precaution duration (RULE SLOT — weeks unsigned)
    kind: restriction
