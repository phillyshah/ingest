protocols:
  - key: tha_primary
    name: Primary total hip arthroplasty — postoperative pathway (structure only)
    population_description: Adults after primary, uncomplicated, unilateral total hip arthroplasty with surgeon protocol and approach known
    branch_conditions: [procedure = total_hip_arthroplasty, no associated procedures]
    eligibility_rules: [branch_primary_tha]
    required_inputs: [affected_side, procedure, procedure_date, surgical_approach, associated_procedures, weight_bearing_status, fixation, surgeon_restrictions, rom_restrictions, hip_flexion_active_deg, assistive_device, wound_status, pain_movement, concerning_findings]
    phases:
      - key: p1_acute
        name: Protect the hip and get moving
        goals: [swelling and pain control, safe transfers within precautions, household walking with the device, hip and thigh muscle activation]
        window: {anchor: procedure, start: 0, end: 2, unit: weeks, provisional: true, text: "About the first two weeks after surgery — typical published window, unsigned; confirm against the surgeon's protocol", provenance: unknown}
        items: [cu_ankle_pump_p1, cu_quad_set_p1, cu_glute_set_p1, cu_heel_slide_p1, cu_abd_slide_p1, cu_stand_abd_p1, cu_stand_ext_p1, cu_sit_to_stand_p1]
        entry_rules: []
        restrictions: [weight bearing per surgeon, hip precautions per approach (posterior — no bending past the surgeon's limit, no crossing the legs, no turning the foot in; anterior — no taking the leg back and out together; lateral — no active leg-out-to-the-side until cleared), raised seat and toilet seat, pillow between the knees in bed, sock aid and long shoehorn, use the walking device until cleared]
        review_checkpoint: PT confirms wound state, device, and that precautions are understood before any loaded work
        advance_criteria: [PT-confirmed criteria (independent with device, wound closed, precautions understood) — thresholds unsigned]
        hold_criteria: [pain or swelling increasing, wound concern]
        regress_criteria: [sudden hip pain with a short or turned-out leg, calf pain, fever, drainage — route to surgeon]
        basis: []
        gaps: [doses not supplied, thresholds not signed, windows are typical published values not signed, precaution durations not signed]
      - key: p2_early_strength
        name: Build strength
        goals: [wean the walking device, normal gait, hip strength within precautions]
        window: {anchor: procedure, start: 2, end: 6, unit: weeks, provisional: true, text: "About weeks two to six — typical published window, unsigned", provenance: unknown}
        items: [cu_bridge_p2, cu_mini_squat_p2, cu_bike_p2, cu_sls_p2, cu_stand_abd_p1, cu_stand_ext_p1, cu_prone_p2, cu_seated_march_p2]
        entry_rules: [phase_entry_criteria_slot]
        restrictions: [weight bearing per surgeon, hip precautions per approach until the surgeon lifts them]
        review_checkpoint: PT confirms criteria; precautions lifted only on the surgeon's word
        advance_criteria: [PT-confirmed criteria — thresholds unsigned]
        hold_criteria: [pain increase with loading]
        regress_criteria: [pain or swelling increase for more than a day after a session]
        basis: []
        gaps: [doses not supplied, thresholds not signed, windows not signed]
      - key: p3_functional
        name: Functional strengthening
        goals: [community walking, stairs without a rail, single-leg balance, return to low-impact activity]
