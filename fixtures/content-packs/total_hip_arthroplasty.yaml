intake_prompts:
  affected_side: Which hip was replaced
  procedure: The procedure performed
  procedure_date: The date of surgery anchors every phase window
  surgical_approach: Posterior, anterior or lateral — decides which movements are restricted
  associated_procedures: Anything beyond a primary replacement changes the pathway
  weight_bearing_status: Weight-bearing status is surgeon-set and never assumed
  fixation: Cemented or uncemented fixation bears on weight bearing
  surgeon_restrictions: The surgeon's restrictions and precautions, in their words
  rom_restrictions: The hip flexion limit and any other range limit from the surgeon
  hip_flexion_active_deg: Current active hip flexion
  assistive_device: Walker, crutches, cane or none
  wound_status: Wound healing, closed, or a concern
  pain_movement: Pain with movement now
  concerning_findings: Concern screen must be completed (dislocation signs, calf symptoms, fever, drainage, falls)
