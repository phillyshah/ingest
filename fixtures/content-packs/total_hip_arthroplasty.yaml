        items: [cu_step_up_p3, cu_bike_p3, cu_sls_p3, cu_bridge_p2, cu_mini_squat_p2]
        entry_rules: [phase_entry_criteria_slot]
        restrictions: [no running or jumping; low-impact only unless the surgeon says otherwise]
        review_checkpoint: PT confirms criteria and surgeon clearance for activity
        advance_criteria: [PT-confirmed criteria — thresholds unsigned]
        hold_criteria: [pain with loading]
        regress_criteria: [pain increase]
        basis: []
        gaps: [doses not supplied, thresholds not signed, windows not signed]
