  - {key: cu_step_up_p3, variant: step_up_forward_low, phase: functional_strengthening, goals: [stairs], dose_envelope: {sets: {null_reason: "Not supplied", provenance: unknown}, repetitions: {null_reason: "Not supplied", provenance: unknown}}, supporting_claims: [], directness: unknown, support_category: insufficient_support}
