rules:
  - key: req_side
    name: Operated side must be established
    kind: required_input
    expression: {op: known, field: affected_side}
    action: {type: require_field, field: affected_side, reason: "Laterality is not established"}
    severity: block
  - key: req_procedure
    name: Procedure and date are required
    kind: required_input
    expression: {op: and, args: [{op: known, field: procedure}, {op: known, field: procedure_date}]}
    action: {type: require_field, fields: [procedure, procedure_date], reason: "The procedure and its date anchor every phase window"}
    severity: block
  - key: req_associated
    name: Associated procedures must be known
    kind: required_input
    expression: {op: known, field: associated_procedures}
    action: {type: require_field, field: associated_procedures, reason: "Revision, osteotomy, fracture fixation or extensor-mechanism repair are different pathways"}
    severity: block
  - key: req_surgeon_status
    name: Weight-bearing status, fixation and surgeon restrictions are required
    kind: required_input
    expression: {op: and, args: [{op: known, field: weight_bearing_status}, {op: known, field: fixation}, {op: known, field: surgeon_restrictions}, {op: known, field: rom_restrictions}, {op: known, field: brace_restrictions}]}
    action: {type: require_field, fields: [weight_bearing_status, fixation, surgeon_restrictions, rom_restrictions, brace_restrictions], reason: "Weight bearing is surgeon-set and fixation bears on it; neither is ever assumed"}
    severity: block
  - key: req_current_assessment
    name: Current assessment is required
    kind: required_input
    expression: {op: and, args: [{op: known, field: knee_flexion_active_deg}, {op: known, field: knee_extension_deficit_deg}, {op: known, field: extension_lag_deg}, {op: known, field: assistive_device}, {op: known, field: wound_status}, {op: known, field: pain_movement}, {op: known, field: concerning_findings}]}
    action: {type: require_field, fields: [knee_flexion_active_deg, knee_extension_deficit_deg, extension_lag_deg, assistive_device, wound_status, pain_movement, concerning_findings], reason: "Current knee measures, device, wound state and the concern screen are required"}
    severity: block
  - key: concern_findings_present
    name: Concerning findings reported
    kind: concern_screen
    expression: {op: and, args: [{op: known, field: concerning_findings}, {op: ne, field: concerning_findings, value: []}]}
    action: {type: block_for_review, message: "Concerning findings after a knee replacement (calf pain or swelling, fever, wound drainage, sudden loss of motion, a fall) route to the surgeon or clinician per approved rule (unsigned)."}
    severity: block
  - key: wound_concern
    name: Wound concern reported
    kind: concern_screen
    expression: {op: eq, field: wound_status, value: concern}
    action: {type: block_for_review, message: "A wound concern is a surgeon question before any loading progression."}
    severity: block
  - key: combined_procedure
    name: Not a primary uncomplicated TKA
    kind: restriction
    expression: {op: and, args: [{op: known, field: associated_procedures}, {op: ne, field: associated_procedures, value: []}]}
    action: {type: block_for_review, message: "Revision, tubercle osteotomy, periprosthetic fracture fixation or extensor-mechanism repair are not merged with the primary pathway; a separate approved pathway is required."}
    severity: block
  - key: protected_weight_bearing
    name: Protected weight bearing excludes standing loaded work
    kind: restriction
    expression: {op: in, field: weight_bearing_status, value: [pwb, tdwb, nwb]}
    action: {type: exclude_variant, tags: [closed_chain, stairs]}
    severity: block
  - key: worsening_response
    name: Worsening response after prior session
    kind: next_day_response
    expression: {op: eq, field: prior_session_response, value: worse}
    action: {type: block_for_review, message: "Worsened response; routing requires an approved rule."}
    severity: block
  - key: branch_primary_tka
    name: Primary uncomplicated TKA
    kind: eligibility
    expression: {op: and, args: [{op: eq, field: procedure, value: total_knee_arthroplasty}, {op: eq, field: associated_procedures, value: []}]}
    action: {type: inform, message: primary uncomplicated TKA pathway}
  - key: phase_entry_criteria_slot
    name: Phase advancement criteria (RULE SLOT — unsigned)
    kind: progression
    expression: {op: eq, field: functional_criteria_met, value: true}
    action: {type: inform, message: "Advance only when PT-confirmed criteria are met; elapsed time is never a criterion on its own."}
  - key: flexion_milestone_slot
    name: Flexion milestone (RULE SLOT — threshold unsigned)
    kind: progression
    expression: {op: known, field: knee_flexion_active_deg}
    action: {type: inform, message: "A signed rule will test knee_flexion_active_deg against the phase's flexion milestone; until signed this only confirms the measure was taken."}
  - key: extension_milestone_slot
    name: Extension milestone (RULE SLOT — threshold unsigned)
    kind: progression
    expression: {op: and, args: [{op: known, field: knee_extension_deficit_deg}, {op: known, field: extension_lag_deg}]}
    action: {type: inform, message: "A signed rule will test extension deficit and extension lag against the phase's milestone; until signed this only confirms the measures were taken."}
  - key: earliest_start_slot
    name: Earliest phase start (RULE SLOT — floor unsigned)
    kind: progression
    expression: {op: known, field: days_since_procedure}
    action: {type: inform, message: "A signed rule will combine days_since_procedure with criteria as a floor (never as the sole trigger); until signed this only confirms the date is known."}
  - key: stiff_knee_surgeon_review_slot
    name: Persistent stiffness surgeon review (RULE SLOT — unsigned)
    kind: restriction
    expression: {op: and, args: [{op: known, field: knee_flexion_active_deg}, {op: known, field: days_since_procedure}]}
    action: {type: inform, message: "A signed rule will route flexion below the surgeon's threshold at the agreed week to surgeon review (manipulation consideration)."}
protocols:
  - key: tka_primary
    name: Primary total knee arthroplasty — postoperative pathway (structure only)
    population_description: Adults after primary, uncomplicated, unilateral total knee arthroplasty with surgeon protocol available
    branch_conditions: [procedure = total_knee_arthroplasty, no associated procedures]
    eligibility_rules: [branch_primary_tka]
    required_inputs: [affected_side, procedure, procedure_date, associated_procedures, weight_bearing_status, fixation, surgeon_restrictions, rom_restrictions, brace_restrictions, knee_flexion_active_deg, knee_extension_deficit_deg, extension_lag_deg, assistive_device, wound_status, pain_movement, concerning_findings]
    phases:
      - key: p1_acute
        name: Protect and wake up the muscle
        goals: [swelling and pain control, full passive extension, early knee flexion, quadriceps activation, safe transfers and household walking with the device]
        window: {anchor: procedure, start: 0, end: 2, unit: weeks, provisional: true, text: "About the first two weeks after surgery — typical published window, unsigned; confirm against the surgeon's protocol", provenance: unknown}
        items: [cu_ankle_pump_p1, cu_quad_set_p1, cu_glute_set_p1, cu_heel_slide_p1, cu_saq_p1, cu_heel_prop_p1, cu_slr_p1, cu_seated_flex_p1, cu_stand_abd_p1]
        entry_rules: []
        restrictions: [weight bearing per surgeon, no pillow under the knee, ice and elevation after exercise, keep the wound dry, use the walking device until cleared]
        review_checkpoint: PT confirms extension deficit, flexion, lag and wound state before any loaded work
        advance_criteria: [PT-confirmed criteria (flexion, extension, lag, independent with device, wound closed) — thresholds unsigned]
        hold_criteria: [effusion or pain increasing, wound concern]
        regress_criteria: [new calf pain, fever, drainage — route to surgeon]
        basis: []
        gaps: [doses not supplied, thresholds not signed, windows are typical published values not signed]
      - key: p2_early_strength
        name: Build strength and bend
        goals: [knee flexion progressing toward the surgeon's target, full extension, wean the walking device, reciprocal stairs, normal gait]
        window: {anchor: procedure, start: 2, end: 6, unit: weeks, provisional: true, text: "About weeks two to six — typical published window, unsigned", provenance: unknown}
        items: [cu_heel_slide_p2, cu_seated_flex_p1, cu_heel_prop_p1, cu_slr_p1, cu_bike_p2, cu_mini_squat_p2, cu_sit_to_stand_p2, cu_tke_p2, cu_calf_raise_p2, cu_sls_p2]
        entry_rules: [phase_entry_criteria_slot]
        restrictions: [weight bearing per surgeon, squat depth per clinical lead]
        review_checkpoint: PT confirms criteria; flexion below the surgeon's threshold at the agreed week is a surgeon question
        advance_criteria: [PT-confirmed criteria — thresholds unsigned]
        hold_criteria: [effusion increase with loading]
        regress_criteria: [pain or effusion increase for more than a day after a session]
        basis: []
        gaps: [doses not supplied, thresholds not signed, windows not signed]
      - key: p3_functional
        name: Functional strengthening
        goals: [community walking, stairs without a rail, single-leg balance, return to low-impact activity]
        window: {anchor: procedure, start: 6, end: 12, unit: weeks, provisional: true, text: "About weeks six to twelve — typical published window, unsigned", provenance: unknown}
        items: [cu_step_up_p3, cu_mini_squat_p3, cu_bike_p3, cu_sls_p3, cu_tke_p2, cu_calf_raise_p2]
        entry_rules: [phase_entry_criteria_slot]
        restrictions: [no running or jumping; low-impact only unless the surgeon says otherwise]
        review_checkpoint: PT confirms criteria and surgeon clearance for activity
        advance_criteria: [PT-confirmed criteria — thresholds unsigned]
        hold_criteria: [effusion with loading]
        regress_criteria: [pain or effusion increase]
        basis: []
        gaps: [doses not supplied, thresholds not signed, windows not signed]
    monitoring: [pain, effusion, knee flexion and extension, extension lag, wound, walking device, calf symptoms]
    reassessment: {timing: "per surgeon protocol", provenance: unknown}
    recovery_horizon: {text: "Return to low-impact activity is commonly described over three to six months; depends on the surgeon protocol and criteria; not signed", provenance: unknown}
    provenance: {kind: structural_placeholder, refs: []}
applicability: []
intake_prompts:
  affected_side: Which knee was replaced
  procedure: The procedure performed
  procedure_date: The date of surgery anchors every phase window
  associated_procedures: Anything beyond a primary replacement changes the pathway
  weight_bearing_status: Weight-bearing status is surgeon-set and never assumed
  fixation: Cemented or uncemented fixation bears on weight bearing
  surgeon_restrictions: The surgeon's restrictions, in their words
  rom_restrictions: Any range-of-motion limit from the surgeon
  brace_restrictions: Brace or immobiliser instructions, if any
  knee_flexion_active_deg: Current active knee flexion
  knee_extension_deficit_deg: Degrees short of full extension
  extension_lag_deg: Quad lag on a straight leg raise
  assistive_device: Walker, crutches, cane or none
  wound_status: Wound healing, closed, or a concern
  pain_movement: Pain with movement now
  concerning_findings: Concern screen must be completed (calf symptoms, fever, drainage, falls)
