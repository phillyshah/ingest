pack: total_knee_arthroplasty
version: 0.1.0
family: total_knee_arthroplasty
approval_state: unsigned_placeholder
label: "Primary total knee arthroplasty — UNSIGNED PLACEHOLDER, not a treatment protocol"
# Structure only. Every dose is null with a reason; every window is provisional with provenance unknown; every
# numeric criterion is a rule slot marked as such. The phases, exercises and required inputs mirror what commonly
# published post-TKA protocols contain, so a clinical lead has a shape to fill in and sign — nothing here is a
# prescription until they do. Population: primary, uncomplicated, unilateral TKA with no surgeon-specific
# restrictions beyond those entered at intake. Revision, tubercle osteotomy, periprosthetic fracture and
# extensor-mechanism repair are different pathways and are blocked by the associated-procedures rule.
condition:
  internal_code: total_knee_arthroplasty
  preferred_name: Total knee arthroplasty, primary
  synonyms: [total knee arthroplasty, TKA, total knee replacement, TKR, knee replacement, knee arthroplasty, knee replacement surgery, new knee]
  body_region: knee
  ambiguity_flags: [laterality_required, weight_bearing_status_required, fixation_not_inferable, surgeon_protocol_required, bilateral_not_supported]
  icd10cm:
    - {code: Z96.651, relationship: exact, laterality: right}
    - {code: Z96.652, relationship: exact, laterality: left}
    - {code: Z96.653, relationship: exact, laterality: bilateral}
    - {code: Z96.659, relationship: exact, laterality: unspecified}
    - {code: Z47.1, relationship: broader, laterality: unspecified}
    - {code: M17.11, relationship: broader, laterality: right}
    - {code: M17.12, relationship: broader, laterality: left}
    - {code: M17.0, relationship: broader, laterality: bilateral}
sources: []
claims: []
concepts:
  - key: ankle_pump
    preferred_name: Ankle pumps
    aliases: [ankle pumping, calf pumps, foot pumps]
    body_region: knee
    movement_purpose: calf muscle pumping to move blood and reduce swelling
    variants:
      - key: ankle_pump_supine
        name: Ankle pumps (lying down)
        assistance: active
        region: knee
        joint: ankle
        starting_position: lying on your back with the legs straight
        side_behavior: bilateral
        equipment: []
        setting: [home, supervised]
        step_sequence:
          - Lie on your back with both legs straight.
          - Point your toes away from you, then pull them up toward you.
          - Keep going at a steady pace.
        cues: [Move only the ankle; keep the knee still.]
        target_impairment: [swelling, circulation]
        functional_goal: [swelling control]
        tags: [requires_supine, circulation]
  - key: quad_set
    preferred_name: Thigh squeeze
    aliases: [quad set, quadriceps setting, static quad, quad squeeze]
    body_region: knee
    movement_purpose: waking up the thigh muscle without bending the knee
    variants:
      - key: quad_set_supine
        name: Thigh squeeze (lying down, knee straight)
        assistance: active
        region: knee
        joint: tibiofemoral
        starting_position: lying on your back with the operated leg straight
        side_behavior: unilateral
        equipment: []
        setting: [home, supervised]
        step_sequence:
          - Lie on your back with the operated leg straight.
          - Tighten the muscle on the front of your thigh so the back of the knee presses down.
          - Hold, then relax.
        cues: [Pull the kneecap up toward your hip; keep the toes pointing up.]
        common_errors: [Lifting the heel instead of pressing the knee down.]
        target_impairment: [quadriceps inhibition]
        functional_goal: [knee control, walking]
        tags: [requires_supine, isometric]
        requires_starting_position: true
  - key: glute_set
    preferred_name: Buttock squeeze
    aliases: [glute set, gluteal set, buttock squeeze]
    body_region: knee
    movement_purpose: activating the hip muscles while lying down
    variants:
      - key: glute_set_supine
        name: Buttock squeeze (lying down)
        assistance: active
        region: knee
        joint: hip
        starting_position: lying on your back
        side_behavior: bilateral
        equipment: []
        setting: [home]
        step_sequence:
          - Lie on your back.
          - Squeeze your buttocks together.
          - Hold, then relax.
        target_impairment: [gluteal inhibition]
        functional_goal: [standing balance]
        tags: [requires_supine, isometric]
  - key: heel_slide
    preferred_name: Heel slide
    aliases: [supine heel slide, knee bend slide, knee flexion slide]
    body_region: knee
    movement_purpose: bending the knee a little further each time
    variants:
      - key: heel_slide_active
        name: Heel slide (lying down)
        assistance: active
        region: knee
        joint: tibiofemoral
        movement_plane: sagittal
        starting_position: lying on your back with the legs straight
        side_behavior: unilateral
        equipment: []
        setting: [home, supervised]
        step_sequence:
          - Lie on your back with your legs straight.
          - Slide the heel of the operated leg toward your bottom so the knee bends.
          - Go as far as is comfortable, hold, then slide back slowly.
        cues: [Keep the heel on the surface the whole time.]
        common_errors: [Letting the knee roll outward.]
        target_impairment: [limited knee flexion]
        functional_goal: [sit-to-stand, stairs]
        tags: [requires_supine, range_limited]
        requires_starting_position: true
      - key: heel_slide_assisted_strap
        name: Heel slide with a strap (lying down)
        assistance: active_assisted
        region: knee
        joint: tibiofemoral
        movement_plane: sagittal
        starting_position: lying on your back, a strap or towel looped around the foot
        side_behavior: unilateral
        equipment: [strap]
        setting: [home, supervised]
        step_sequence:
          - Lie on your back with a strap or towel around the foot of the operated leg.
          - Slide the heel toward your bottom, using the strap to help the knee bend a little further.
          - Hold, then slide back slowly.
        cues: [Use the strap to help, not to force.]
        target_impairment: [limited knee flexion]
        functional_goal: [sit-to-stand, stairs]
        tags: [requires_supine, range_limited]
        requires_starting_position: true
  - key: short_arc_quad
    preferred_name: Short-arc knee straightening
    aliases: [short arc quad, SAQ, knee extension over a roll]
    body_region: knee
    movement_purpose: straightening the knee through the last part of its range
    variants:
      - key: saq_supine_roll
        name: Short-arc knee straightening (over a rolled towel)
        assistance: active
        region: knee
        joint: tibiofemoral
        movement_plane: sagittal
        starting_position: lying on your back with a rolled towel under the operated knee
        side_behavior: unilateral
        equipment: [rolled towel]
        setting: [home, supervised]
        step_sequence:
          - Lie on your back with a rolled towel under the operated knee.
          - Straighten the knee by lifting the foot, keeping the back of the knee on the towel.
          - Hold, then lower slowly.
        target_impairment: [quadriceps weakness, extension lag]
        functional_goal: [walking]
        tags: [requires_supine]
        requires_starting_position: true
  - key: straight_leg_raise
    preferred_name: Straight leg raise
    aliases: [SLR, leg lift]
    body_region: knee
    movement_purpose: lifting the straight leg to strengthen the thigh
    variants:
      - key: slr_active
        name: Straight leg raise (lying down)
        assistance: active
        region: knee
        joint: tibiofemoral
        starting_position: lying on your back, the other knee bent with the foot flat
        side_behavior: unilateral
        equipment: []
        setting: [home, supervised]
        step_sequence:
          - Lie on your back with the other knee bent and that foot flat.
          - Tighten the thigh of the operated leg and keep the knee straight.
          - Lift the leg to the height of the other knee, then lower slowly.
        cues: [Lock the knee straight before you lift.]
        common_errors: [Letting the knee bend as the leg comes up.]
        target_impairment: [quadriceps weakness, extension lag]
        functional_goal: [walking, getting in and out of a car]
        tags: [requires_supine]
        requires_starting_position: true
  - key: heel_prop
    preferred_name: Heel prop for knee straightening
    aliases: [heel prop, prone hang alternative, extension hang]
    body_region: knee
    movement_purpose: letting the knee settle into full straightness
    variants:
      - key: heel_prop_supine
        name: Heel prop (lying down, heel on a roll)
        assistance: passive
        region: knee
        joint: tibiofemoral
        movement_plane: sagittal
        starting_position: lying on your back with the heel resting on a rolled towel and nothing under the knee
        side_behavior: unilateral
        equipment: [rolled towel]
        setting: [home]
        step_sequence:
          - Lie on your back and rest the heel of the operated leg on a rolled towel.
          - Leave nothing under the knee and let it relax toward straight.
          - Stay there for the time your PT sets.
        cues: [Relax the thigh; gravity does the work.]
        common_errors: [Putting a pillow under the knee.]
        target_impairment: [extension deficit]
        functional_goal: [walking without a limp]
        tags: [requires_supine, extension]
        requires_starting_position: true
  - key: seated_knee_flexion
    preferred_name: Seated knee bend
    aliases: [seated knee flexion, chair knee bend, seated heel slide]
    body_region: knee
    movement_purpose: bending the knee while sitting, with help from the other leg
    variants:
      - key: seated_flexion_assisted
        name: Seated knee bend (helped by the other leg)
        assistance: active_assisted
        region: knee
        joint: tibiofemoral
        movement_plane: sagittal
        starting_position: sitting on a firm chair, feet on the floor
        side_behavior: unilateral
        equipment: [chair]
        setting: [home, supervised]
        step_sequence:
          - Sit on a firm chair with both feet on the floor.
          - Slide the foot of the operated leg back under the chair so the knee bends.
          - Use the other foot to gently push it a little further, hold, then relax.
        target_impairment: [limited knee flexion]
        functional_goal: [sit-to-stand, stairs, cycling]
        tags: [seated, range_limited]
  - key: standing_hip_abduction
    preferred_name: Standing leg out to the side
    aliases: [standing hip abduction, side leg lift standing]
    body_region: knee
    movement_purpose: strengthening the hip muscles that keep the knee steady
    variants:
      - key: standing_abduction_support
        name: Standing leg out to the side (holding a counter)
        assistance: active
        region: knee
        joint: hip
        movement_plane: frontal
        starting_position: standing tall holding a counter or the back of a chair
        side_behavior: unilateral
        equipment: [counter or chair]
        setting: [home]
        step_sequence:
          - Stand tall holding a counter or the back of a chair.
          - Keep the operated leg straight and lift it out to the side.
          - Lower slowly.
        cues: [Keep the toes pointing forward; do not lean.]
        target_impairment: [hip abductor weakness]
        functional_goal: [standing balance, walking]
        tags: [standing, balance_support]
  - key: mini_squat
    preferred_name: Mini squat
    aliases: [partial squat, small knee bend standing, wall mini squat]
    body_region: knee
    movement_purpose: bending both knees a little while standing
    variants:
      - key: mini_squat_support
        name: Mini squat (holding a counter)
        assistance: active
        region: knee
        joint: tibiofemoral
        chain: closed
        starting_position: standing with feet shoulder-width apart, hands on a counter
        side_behavior: bilateral
        equipment: [counter]
        setting: [home, supervised]
        step_sequence:
          - Stand with your feet shoulder-width apart, hands on a counter.
          - Bend both knees a small amount, keeping the knees over the toes.
          - Straighten back up.
        cues: [Only go as low as your PT set; keep the weight even on both feet.]
        common_errors: [Letting the knees drift inward.]
        target_impairment: [quadriceps weakness]
        functional_goal: [sit-to-stand, stairs]
        tags: [closed_chain, standing]
  - key: sit_to_stand
    preferred_name: Sit to stand
    aliases: [chair rise, chair stand, sit-to-stand]
    body_region: knee
    movement_purpose: getting up from a chair using the legs
    variants:
      - key: sit_to_stand_arms
        name: Sit to stand (using the arms as needed)
        assistance: active
        region: knee
        joint: tibiofemoral
        chain: closed
        starting_position: sitting on a firm chair with armrests, feet flat
        side_behavior: bilateral
        equipment: [chair]
        setting: [home, supervised]
        step_sequence:
          - Sit toward the front of a firm chair with your feet flat.
          - Lean forward and stand up, using the armrests as much as you need.
          - Sit back down slowly.
        cues: [Nose over toes as you stand.]
        target_impairment: [lower limb weakness]
        functional_goal: [sit-to-stand]
        tags: [closed_chain, functional]
  - key: step_up
    preferred_name: Step up
    aliases: [step-up, forward step up, low step up]
    body_region: knee
    movement_purpose: stepping up onto a low step with the operated leg
    variants:
      - key: step_up_forward_low
        name: Step up (low step, holding a rail)
        assistance: active
        region: knee
        joint: tibiofemoral
        chain: closed
        starting_position: standing facing a low step, holding a rail
        side_behavior: unilateral
        equipment: [step, rail]
        setting: [home, supervised]
        step_sequence:
          - Stand facing a low step, holding a rail.
          - Step up with the operated leg, bringing the other foot up to join it.
          - Step down slowly, operated leg last.
        cues: [Keep the knee in line with the second toe.]
        target_impairment: [quadriceps weakness]
        functional_goal: [stairs]
        tags: [closed_chain, standing, stairs]
  - key: stationary_bike
    preferred_name: Stationary bike
    aliases: [exercise bike, cycling, bike rocking]
    body_region: knee
    movement_purpose: cycling to gain knee bend and keep the joint moving
    variants:
      - key: bike_rocking
        name: Stationary bike (rocking back and forth)
        assistance: active
        region: knee
        joint: tibiofemoral
        chain: closed
        starting_position: seated on a stationary bike with the seat high
        side_behavior: bilateral
        equipment: [stationary bike]
        setting: [home, supervised]
        step_sequence:
          - Sit on the bike with the seat set high.
          - Rock the pedals back and forth as far as the knee comfortably allows.
          - When you can get all the way round, pedal slowly with no resistance.
        cues: [Lower the seat a little as the knee bends more.]
        target_impairment: [limited knee flexion]
        functional_goal: [cycling, stairs]
        tags: [closed_chain, seated, requires_bike]
  - key: terminal_knee_extension
    preferred_name: Knee straightening with a band
    aliases: [terminal knee extension, TKE, band knee extension]
    body_region: knee
    movement_purpose: straightening the knee fully against a band while standing
    variants:
      - key: tke_band_standing
        name: Knee straightening with a band (standing)
        assistance: resisted
        region: knee
        joint: tibiofemoral
        chain: closed
        load_mode: elastic_band
        starting_position: standing with a band looped behind the operated knee and anchored in front
        side_behavior: unilateral
        equipment: [elastic band]
        setting: [home, supervised]
        step_sequence:
          - Loop a band behind the operated knee and anchor it in front of you.
          - Let the knee bend slightly, then straighten it fully against the band.
          - Hold, then let it bend again slowly.
        target_impairment: [extension lag, quadriceps weakness]
        functional_goal: [walking without a limp]
        tags: [closed_chain, standing, strengthening]
  - key: calf_raise
    preferred_name: Heel raise
    aliases: [calf raise, heel rise]
    body_region: knee
    movement_purpose: rising onto the toes to strengthen the calf
    variants:
      - key: calf_raise_support
        name: Heel raise (holding a counter)
        assistance: active
        region: knee
        joint: ankle
        chain: closed
        starting_position: standing holding a counter
        side_behavior: bilateral
        equipment: [counter]
        setting: [home]
        step_sequence:
          - Stand holding a counter.
          - Rise up onto your toes, then lower slowly.
        target_impairment: [calf weakness]
        functional_goal: [walking]
        tags: [closed_chain, standing]
  - key: single_leg_stance
    preferred_name: Single-leg balance
    aliases: [single leg stance, one-leg balance]
    body_region: knee
    movement_purpose: standing on the operated leg to train balance
    variants:
      - key: sls_support
        name: Single-leg balance (near a counter)
        assistance: active
        region: knee
        joint: tibiofemoral
        chain: closed
        starting_position: standing near a counter for safety
        side_behavior: unilateral
        equipment: [counter]
        setting: [home, supervised]
        step_sequence:
          - Stand near a counter for safety.
          - Lift the other foot and balance on the operated leg.
          - Hold for the time your PT sets, then rest.
        target_impairment: [balance deficit]
        functional_goal: [standing balance, stairs]
        tags: [standing, balance, balance_support]
        balance_demand: high
