rules:
  - key: req_side
    name: Affected side must be established
    kind: required_input
    expression: {op: known, field: affected_side}
    action: {type: require_field, field: affected_side, reason: Laterality is not established}
    severity: block
  - key: req_confirmation
    name: Diagnosis must be clinically confirmed
    kind: required_input
    expression: {op: known, field: diagnosis_confirmation}
    action: {type: require_field, field: diagnosis_confirmation, reason: Clinical confirmation of adhesive capsulitis is required}
    severity: block
  - key: req_irritability
    name: Irritability must be assessed
    kind: required_input
    expression: {op: known, field: irritability}
    action: {type: require_field, field: irritability, reason: Required by pathway eligibility rules}
    severity: block
  - key: req_rom
    name: Motion limitation must be measured
    kind: required_input
    expression: {op: and, args: [{op: known, field: rom_active}, {op: known, field: rom_passive}]}
    action: {type: require_field, fields: [rom_active, rom_passive], reason: Active and passive ROM with units and context are required}
    severity: block
  - key: req_restrictions
    name: Restrictions and procedures must be known
    kind: required_input
    expression: {op: and, args: [{op: known, field: surgeon_restrictions}, {op: known, field: procedure}]}
    action: {type: require_field, fields: [surgeon_restrictions, procedure], reason: Unknown is not equivalent to no restrictions}
    severity: block
  - key: req_goals
    name: Functional goals must be stated
    kind: required_input
    expression: {op: known, field: goals}
    action: {type: require_field, field: goals, reason: Functional goals drive branch selection}
    severity: block
  - key: req_prior_treatment
    name: Relevant prior treatment must be recorded
    kind: required_input
    expression: {op: known, field: prior_interventions}
    action: {type: require_field, field: prior_interventions, reason: Prior injection or procedure is contextual data required by the pathway}
    severity: block
  - key: req_concern_screen
    name: Concern screen must be completed
    kind: required_input
    expression: {op: known, field: concerning_findings}
    action: {type: require_field, field: concerning_findings, reason: A missing symptom report is not a negative finding}
    severity: block
  - key: concern_findings_present
    name: Concerning neurologic or systemic findings reported
    kind: concern_screen
    expression: {op: and, args: [{op: known, field: concerning_findings}, {op: ne, field: concerning_findings, value: []}]}
    action: {type: block_for_review, message: "Concerning findings reported. Routing per approved clinical-lead rule (not yet signed): clinician review before any exercise prescription."}
    severity: block
  - key: postop_needs_own_protocol
    name: Surgically treated shoulder requires its own approved protocol
    kind: restriction
    expression: {op: and, args: [{op: known, field: procedure}, {op: ne, field: procedure, value: none}]}
    action: {type: block_for_review, message: "A surgically treated variant needs its own approved protocol; none is published for this procedure."}
    severity: block
  - key: worsening_response
    name: Worsening response after prior session
    kind: next_day_response
    expression: {op: eq, field: prior_session_response, value: worse}
    action: {type: block_for_review, message: "Worsened response after a prior session. Routing must follow an approved rule; clinical lead has not signed thresholds."}
    severity: block
  - key: branch_high_irritability
    name: High irritability branch
    kind: eligibility
    expression: {op: eq, field: irritability, value: high}
    action: {type: inform, message: symptom-limited mobility branch}
  - key: branch_lower_irritability
    name: Lower irritability with stiffness branch
    kind: eligibility
    expression: {op: in, field: irritability, value: [low, moderate]}
    action: {type: inform, message: mobility restoration branch}
  - key: branch_functional
    name: Functional strengthening branch (criteria met)
    kind: eligibility
    expression: {op: and, args: [{op: eq, field: irritability, value: low}, {op: eq, field: functional_criteria_met, value: true}]}
    action: {type: inform, message: functional strengthening branch}
  - key: starting_position_slot
    name: Cannot assume required starting position (RULE SLOT — unsigned)
    kind: restriction
    expression: {op: eq, field: can_assume_starting_position, value: false}
    action: {type: exclude_variant, tags: [requires_supine, requires_seated_at_table]}
    severity: warning
    rationale: Placeholder slot. Only executable once a clinical lead signs it (spec §19 action_type).
protocols:
  - key: fs_symptom_limited
    name: Frozen shoulder — symptom-limited mobility branch
    population_description: Adults with clinically confirmed adhesive capsulitis and high irritability
    branch_conditions: [irritability = high]
    eligibility_rules: [branch_high_irritability]
    required_inputs: [affected_side, diagnosis_confirmation, irritability, rom_active, rom_passive, surgeon_restrictions, procedure, goals, prior_interventions, concerning_findings]
    phases:
      - key: p_symptom_limited
        name: Symptom-limited mobility
        goals: [reduce irritability, maintain motion within symptom limits]
        window: {anchor: assessment, start: 0, end: null, unit: weeks, provisional: true,
                 text: "Duration depends on symptom response; source guidance gives no fixed duration", provenance: unknown}
        items: [cu_table_slide_symptom_limited, cu_er_passive_symptom_limited]
        review_checkpoint: Reassess pain, irritability and ROM at the next PT visit (interval set by the PT)
        advance_criteria: [irritability reduced to a level the PT judges appropriate for mobility restoration]
        hold_criteria: [symptoms unchanged]
        regress_criteria: [worsening response after sessions]
        restrictions: []
        basis: [S1_irritability]
        gaps: [dose not supplied, timing not supplied]
    monitoring: [pain at rest/movement/night, next-day response, ROM]
    reassessment: {timing: "per PT; not fixed by source", provenance: unknown}
    recovery_horizon: {text: "Recovery timeline varies widely; no fixed number of weeks is promised", provenance: unknown}
    provenance: {kind: source_family, refs: [S1]}
  - key: fs_mobility_restoration
    name: Frozen shoulder — mobility restoration branch
    population_description: Adults with lower irritability and major stiffness
    branch_conditions: [irritability = low or moderate]
    eligibility_rules: [branch_lower_irritability]
    required_inputs: [affected_side, diagnosis_confirmation, irritability, rom_active, rom_passive, surgeon_restrictions, procedure, goals, prior_interventions, concerning_findings]
    phases:
      - key: p_mobility
        name: Mobility restoration
        goals: [restore elevation and external rotation]
        window: {anchor: assessment, start: 0, end: null, unit: weeks, provisional: true,
                 text: "Duration depends on measured progress", provenance: unknown}
        items: [cu_table_slide_mobility, cu_er_assisted_mobility, cu_scapular_mobility]
        review_checkpoint: Reassess ROM and symptom response at each visit
        advance_criteria: [functional criteria defined by the PT are met]
        hold_criteria: [ROM unchanged without symptom increase]
        regress_criteria: [irritability increases]
        basis: [S1_irritability]
        gaps: [dose not supplied, timing not supplied]
      - key: p_functional
        name: Functional strengthening (when criteria met)
        goals: [overhead function]
        window: {anchor: assessment, start: null, end: null, unit: weeks, provisional: true,
                 text: "Begins only when functional criteria are met; not a scheduled week", provenance: unknown}
        items: [cu_er_resisted_functional]
        entry_rules: [branch_functional]
        review_checkpoint: PT confirms criteria before this phase starts
        advance_criteria: []
        hold_criteria: []
        regress_criteria: [irritability increases]
        basis: []
        gaps: [no source claim linked, dose not supplied]
    monitoring: [pain, ROM, next-day response]
    reassessment: {timing: "per PT", provenance: unknown}
    recovery_horizon: {text: "Recovery timeline varies widely; no fixed number of weeks is promised", provenance: unknown}
    provenance: {kind: source_family, refs: [S1]}
applicability:
  - key: app_age_sex_context
    target: fs_mobility_restoration
    target_type: protocol
    relationship_type: insufficient_evidence
    predicates:
      - {dimension: age, operator: gte, value: 40, unit: years}
    predicate_logic: and
    action_type: inform_only
    generalizability_limits: "Epidemiologic association with age/sex is not a dosing rule (spec §9)."
    evidence_claims: []
  - key: app_bmi_context
    target: fs_mobility_restoration
    target_type: protocol
    relationship_type: insufficient_evidence
    predicates:
      - {dimension: bmi, operator: gte, value: 30, unit: kg/m2}
    action_type: inform_only
    generalizability_limits: "BMI class alone does not establish exercise tolerance or mandate dose reduction (spec §19)."
intake_prompts:
  affected_side: Laterality is not established
  diagnosis_confirmation: Clinical confirmation and assessor are required
  irritability: Required by pathway eligibility rules
  surgeon_restrictions: Unknown is not equivalent to no restrictions
  procedure: Prior procedures determine whether a surgical pathway applies
  rom_active: Active ROM with units and measurement context
  rom_passive: Passive ROM with units and measurement context
  goals: Functional goals drive branch selection
  prior_interventions: Prior injection or procedure is contextual data
  concerning_findings: Concern screen must be completed; a missing report is not a negative finding
