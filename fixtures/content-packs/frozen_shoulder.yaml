pack: frozen_shoulder
version: 0.1.0
family: frozen_shoulder
approval_state: unsigned_placeholder
label: "Adhesive capsulitis (frozen shoulder) — UNSIGNED PLACEHOLDER, not a treatment protocol"
condition:
  internal_code: adhesive_capsulitis
  preferred_name: Adhesive capsulitis (frozen shoulder)
  synonyms: [frozen shoulder, adhesive capsulitis, capsulitis of shoulder, stiff shoulder]
  body_region: shoulder
  ambiguity_flags: [laterality_required, stage_not_inferable_from_onset_alone]
  icd10cm:
    - {code: M75.00, relationship: exact, laterality: unspecified}
    - {code: M75.01, relationship: exact, laterality: right}
    - {code: M75.02, relationship: exact, laterality: left}
sources:
  - key: S1
    url: https://medicine.osu.edu/-/media/files/medicine/departments/sports-medicine/medical-professionals/shoulder-and-elbow/adhesive-capsulitis-2020.pdf
    publisher: Ohio State University Wexner Medical Center
    title: Adhesive Capsulitis / Frozen Shoulder Clinical Practice Guideline
    document_version: revision October 2020
    source_type: pdf
    rights: {can_fetch: unknown, can_store_fulltext: denied, can_store_excerpt: unknown, can_process_with_model: unknown,
             can_display_to_clinician: unknown, can_display_to_patient: denied, can_redistribute: denied, can_train_model: denied}
    rights_evidence: {kind: note, text: "Document carries an explicit licensing notice (spec §4/§17 [S1]). Reference discovery only until cleared."}
    notes: reference-only
claims:
  - key: S1_irritability
    source: S1
    locator: {section: "exercise selection", note: "locator to be confirmed by clinical lead against the document"}
    claim_type: protocol_phase
    paraphrase: Guidance describes matching stretching intensity to the patient's irritability level.
    recommendation_strength_as_reported: as stated in source; not re-graded here
    limitations: Reference only; rights unresolved; exact locator pending.
  - key: S1_dose_uncertainty
    source: S1
    locator: {section: "dosage", note: "locator to be confirmed by clinical lead"}
    claim_type: dose
    paraphrase: Guidance acknowledges uncertainty about optimal stretching dosage.
    limitations: Supports leaving dose fields null rather than generating numbers.
concepts:
  - key: table_slide_elevation
    preferred_name: Supported table-slide elevation
    aliases: [table slide, towel slide on table]
    body_region: shoulder
    movement_purpose: shoulder elevation mobility with body-weight support
    variants:
      - key: table_slide_assisted
        name: Supported table-slide elevation (active-assisted, seated)
        assistance: active_assisted
        region: shoulder
        joint: glenohumeral
        movement_plane: scapular plane elevation
        starting_position: seated at a table, forearm resting on a towel on the table surface
        side_behavior: unilateral
        equipment: [table, towel]
        setting: [home, supervised]
        step_sequence:
          - Sit facing the table with the forearm of the affected arm resting on a towel.
          - Slide the forearm forward along the table by leaning the trunk forward, letting the table support the arm's weight.
          - Move only within the range that stays inside the symptom limit set by your therapist.
          - Return slowly to the start.
        cues: [keep the shoulder relaxed, let the table carry the arm]
        common_errors: [shrugging the shoulder, pushing into sharp pain]
        target_impairment: [limited elevation]
        functional_goal: [reach forward]
        tags: [requires_seated_at_table]
        requires_starting_position: true
        source_reference: {source: S1, locator: {note: "concept named in spec §9 as a candidate for review"}, source_exercise_name: null}
  - key: external_rotation
    preferred_name: Shoulder external rotation
    aliases: [ER, external rotation stretch, external rotation with cane]
    body_region: shoulder
    movement_purpose: restore external rotation range
    variants:
      - key: er_passive_cane
        name: External rotation — passive with cane (supine)
        assistance: passive
        region: shoulder
        joint: glenohumeral
        movement_plane: rotation
        starting_position: lying on the back, elbow bent to 90 degrees and tucked at the side, holding a cane with both hands
        side_behavior: unilateral
        equipment: [cane]
        setting: [home, supervised]
        step_sequence:
          - Lie on your back with the affected elbow bent and tucked at your side, holding a cane in both hands.
          - Use the unaffected arm to push the cane so the affected forearm rotates outward.
          - Stop at the symptom limit set by your therapist; hold as instructed.
          - Return slowly.
        target_impairment: [limited external rotation]
        functional_goal: [reach behind head]
        tags: [requires_supine]
        requires_starting_position: true
        source_reference: {source: S1, locator: {note: "concept named in spec §9"}, source_exercise_name: null}
      - key: er_assisted_cane
        name: External rotation — active-assisted with cane (supine)
        assistance: active_assisted
        region: shoulder
        joint: glenohumeral
        movement_plane: rotation
        starting_position: lying on the back, elbow bent to 90 degrees and tucked at the side, holding a cane with both hands
        side_behavior: unilateral
        equipment: [cane]
        setting: [home, supervised]
        step_sequence:
          - Lie on your back holding a cane in both hands, affected elbow tucked at your side.
          - Rotate the affected forearm outward using its own muscles, with the cane and other arm assisting only as needed.
          - Stay inside the symptom limit set by your therapist.
        target_impairment: [limited external rotation]
        functional_goal: [reach behind head]
        tags: [requires_supine]
        requires_starting_position: true
        source_reference: {source: S1, locator: {note: "concept named in spec §9"}, source_exercise_name: null}
      - key: er_resisted_band
        name: External rotation — resisted with elastic band (standing)
        assistance: resisted
        region: shoulder
        joint: glenohumeral
        movement_plane: rotation
        starting_position: standing, elbow bent to 90 degrees and tucked at the side, band anchored at elbow height
        load_mode: elastic_resistance
        side_behavior: unilateral
        equipment: [elastic band, anchor]
        setting: [home, supervised]
        step_sequence:
          - Stand side-on to the anchor holding the band with the affected hand, elbow tucked at your side.
          - Rotate the forearm outward against the band, keeping the elbow at your side.
          - Return slowly with control.
        target_impairment: [external rotation weakness]
        functional_goal: [overhead function]
        tags: [strengthening]
        source_reference: {source: S1, locator: {note: "concept named in spec §9"}, source_exercise_name: null}
  - key: scapular_control
    preferred_name: Scapular control activity
    aliases: [scapular setting, scapular retraction]
    body_region: shoulder
    movement_purpose: scapular positioning and control
    variants:
      - key: scapular_retraction_active
        name: Scapular retraction — active (seated)
        assistance: active
        region: shoulder
        joint: scapulothoracic
        starting_position: seated upright, arms relaxed at the sides
        side_behavior: bilateral
        equipment: []
        setting: [home, supervised]
        step_sequence:
          - Sit tall with arms relaxed.
          - Draw the shoulder blades gently back and down without shrugging.
          - Hold as instructed, then relax.
        target_impairment: [scapular control]
        functional_goal: [posture during reaching]
        source_reference: {source: S1, locator: {note: "concept named in spec §9"}, source_exercise_name: null}
