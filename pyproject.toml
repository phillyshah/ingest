[project]
name = "moveai-ingest"
version = "0.1.0"
description = "MoveAI Exercise Ingestion and Plan-Drafting Engine (monorepo root)"
requires-python = ">=3.11"
dependencies = [
  "moveai-contracts",
  "moveai-db",
  "moveai-clinical-rules",
  "moveai-api",
  "moveai-ingestion",
  "moveai-planner",
  "moveai-adapter",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pyyaml>=6.0",
  "types-PyYAML",
  "reportlab>=5.0.1",
]

[tool.uv.workspace]
members = [
  "packages/contracts",
  "packages/dbkit",
  "packages/clinical_rules",
  "services/api",
  "services/ingestion",
  "services/planner",
  "adapters/moveai",
]

[tool.uv.sources]
moveai-contracts = { workspace = true }
moveai-db = { workspace = true }
moveai-clinical-rules = { workspace = true }
moveai-api = { workspace = true }
moveai-ingestion = { workspace = true }
moveai-planner = { workspace = true }
moveai-adapter = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".pgdata", "node_modules", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["db/tests", "packages", "services", "adapters", "evals"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
