[project]
name = "moveai-clinical-rules"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "moveai-contracts",
  "moveai-db",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moveai_rules"]

[tool.uv.sources]
moveai-db = { workspace = true }
moveai-contracts = { workspace = true }
moveai-clinical-rules = { workspace = true }
moveai-planner = { workspace = true }
moveai-ingestion = { workspace = true }
