[project]
name = "moveai-contracts"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moveai_contracts"]

[tool.uv.sources]
moveai-contracts = { workspace = true }
moveai-clinical-rules = { workspace = true }
moveai-planner = { workspace = true }
moveai-ingestion = { workspace = true }
