# VPS service definitions. API/worker/UI bind to loopback only; the host reverse proxy is the public entry point (spec §22B).
# Local development can also use this file with the bundled Postgres profile: `docker compose --profile localdb up`.
name: moveai-ingest
services:
  api:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/v1/healthz')"], interval: 30s, timeout: 5s, retries: 3 }
    deploy: { resources: { limits: { cpus: "1.0", memory: 768M } } }
    volumes: ["uploads:/srv/moveai/uploads:ro"]
  worker:
    build: { context: .., dockerfile: infra/Dockerfile.worker }
    env_file: .env
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "1.0", memory: 1G } } }
    volumes: ["uploads:/srv/moveai/uploads:ro", "storage:/app/.demo-out/storage"]
  scheduler:
    build: { context: .., dockerfile: infra/Dockerfile.worker }
    env_file: .env
    command: ["uv", "run", "--no-sync", "python", "scripts/scheduler.py"]
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "0.25", memory: 256M } } }
  reviewer:
    build: { context: .., dockerfile: infra/Dockerfile.reviewer }
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "0.25", memory: 128M } } }
  db:
    profiles: ["localdb"]
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: moveai }
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes: { uploads: {}, storage: {}, pgdata: {} }
