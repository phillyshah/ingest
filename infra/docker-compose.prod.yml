# Production deployment for srv1373951, written against what the server inspection actually found.
#
# That host front-ends every site with Traefik v3.6 on ports 80/443, docker provider, `exposedByDefault: false`,
# entrypoints `web` (HTTP challenge) and `websecure`, certificate resolver `letsencrypt`, watching network
# `proxy`. So this file publishes no ports of its own and joins `proxy`, exactly like the eight sites already
# running there. The labels below copy that convention rather than inventing one.
#
# Access control: NONE at the edge, by the owner's explicit decision. This hostname is reachable by anyone, and
# the reviewer UI's development sign-in lets a visitor pick any role, clinical_lead included.
#
# An earlier revision put the whole site behind a Traefik basic-auth prompt. That was removed because it was not
# wanted, and because it also broke the application: a browser will not preemptively send basic-auth credentials
# to a path scope it has not authenticated, so the SPA's calls to /api were refused before reaching the API.
#
# This is tolerable only while both of these hold:
#   * every content pack is unsigned_placeholder, so no plan can be prescribed, and
#   * there is no patient data.
# When either changes, this needs a real boundary. MOVEAI_ENV stays `staging`, which keeps the API's own guard
# intact: it refuses the development shim outright when told it is production.
name: ingest

x-limits: &limits
  restart: unless-stopped
  # The host has 7.8G RAM and NO SWAP. Limits are deliberate: an unbounded spike here would reach the OOM killer,
  # which picks its victim across the whole machine and could take out labelcheck or the dashboard.
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  api:
    <<: *limits
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      # Stamped so /v1/version reports which commit is actually serving. deploy-ingest sets these.
      args: { GIT_SHA: "${GIT_SHA:-unknown}", BUILT_AT: "${BUILT_AT:-unknown}" }
    env_file: .env
    mem_limit: 640m
    cpus: 0.75
    networks: [proxy]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/v1/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      # Required here though the existing sites omit it: they sit on `proxy` alone, so Traefik has no ambiguity
      # to resolve. Being explicit costs nothing and survives a future second network.
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.ingest-api.rule=Host(`${INGEST_HOST}`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.ingest-api.entrypoints=websecure"
      - "traefik.http.routers.ingest-api.tls.certresolver=letsencrypt"
      # Explicit, rather than relying on Traefik ranking this longer rule above the UI's bare Host() match.
      - "traefik.http.routers.ingest-api.priority=100"
      - "traefik.http.routers.ingest-api.middlewares=ingest-api-strip@docker"
      # The SPA calls /api/v1/*; the API serves /v1/*.
      - "traefik.http.middlewares.ingest-api-strip.stripprefix.prefixes=/api"
      - "traefik.http.services.ingest-api.loadbalancer.server.port=8000"
    volumes:
      # Read-write: /sources/upload writes the PDF here (content-addressed by sha256). The worker mounts the
      # same volume read-only below — it only ever reads what the API already wrote.
      - "uploads:/srv/moveai/uploads"
      # Read-only: GET /media/{id}/file reads fetched/extracted bytes the worker put here. api never writes to it.
      - "storage:/app/.demo-out/storage:ro"

  reviewer:
    <<: *limits
    build: { context: .., dockerfile: infra/Dockerfile.reviewer }
    mem_limit: 96m
    cpus: 0.25
    networks: [proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.ingest-ui.rule=Host(`${INGEST_HOST}`)"
      - "traefik.http.routers.ingest-ui.entrypoints=websecure"
      - "traefik.http.routers.ingest-ui.tls.certresolver=letsencrypt"
      - "traefik.http.services.ingest-ui.loadbalancer.server.port=8080"

  # No proxy network: these reach Supabase outbound and are never addressed from outside.
  worker:
    <<: *limits
    build: { context: .., dockerfile: infra/Dockerfile.worker }
    env_file: .env
    mem_limit: 640m
    cpus: 0.75
    volumes: ["uploads:/srv/moveai/uploads:ro", "storage:/app/.demo-out/storage"]

  scheduler:
    <<: *limits
    build: { context: .., dockerfile: infra/Dockerfile.worker }
    env_file: .env
    command: ["/app/.venv/bin/python", "scripts/scheduler.py"]   # not `uv run`: no writable $HOME cache in the image
    mem_limit: 192m
    cpus: 0.25

networks:
  # Created and owned by the host's Traefik stack in /opt/traefik. Declared external so `docker compose down`
  # here can never remove the network the owner's other eight sites depend on.
  proxy:
    external: true

volumes: { uploads: {}, storage: {} }
