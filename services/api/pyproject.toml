[project]
name = "moveai-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "moveai-contracts",
  "moveai-db",
  "moveai-clinical-rules",
  "moveai-planner",
  "moveai-ingestion",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "sse-starlette>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moveai_api"]

[tool.uv.sources]
moveai-db = { workspace = true }
moveai-contracts = { workspace = true }
moveai-clinical-rules = { workspace = true }
moveai-planner = { workspace = true }
moveai-ingestion = { workspace = true }
