[project]
name = "moveai-adapter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "moveai-contracts",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moveai_adapter"]

[tool.uv.sources]
moveai-contracts = { workspace = true }
moveai-clinical-rules = { workspace = true }
moveai-planner = { workspace = true }
moveai-ingestion = { workspace = true }
