name: ci
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: moveai }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/moveai
      PLAN_SIGNING_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.8.17" }
      - run: uv sync --all-packages
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run python scripts/migrate.py
      - run: uv run python scripts/export_openapi.py --check
      - run: uv run pytest -q
      - run: uv run python scripts/seed.py --with-demo-pack && uv run python scripts/demo.py
  reviewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # No version input: the pnpm version comes from "packageManager" in the root package.json.
      - uses: actions/setup-node@v4
        # The pnpm workspace root holds the lockfile (pnpm-workspace.yaml + package.json at the repo root).
        with: { node-version: 22, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/reviewer lint
      - run: pnpm -C apps/reviewer test
      - run: pnpm -C apps/reviewer build

  # The containers are what actually runs on the server, and nothing above ever starts one. That gap let a
  # runtime-only failure reach production: `uv run` in the CMD needed a cache under $HOME, which the image's
  # `useradd -r` account has no permission to create, so every Python container exited before Python started.
  # Unit tests could not have caught it — they never run as that user, in that image, through that CMD.
  # This job boots them for real.
  containers:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: moveai }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # host.docker.internal so the containers reach the runner's postgres service.
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:55432/moveai
      PLAN_SIGNING_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.8.17" }

      - name: Prepare the schema the containers will talk to
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/moveai
        run: uv sync --all-packages && uv run python scripts/migrate.py

      - run: docker build -f infra/Dockerfile.api -t ingest-api .
      - run: docker build -f infra/Dockerfile.worker -t ingest-worker .

      - name: The API container must serve healthz as its unprivileged user
        run: |
          docker run -d --name api --add-host host.docker.internal:host-gateway \
            -e DATABASE_URL -e PLAN_SIGNING_SECRET -e MOVEAI_ENV=staging -e AUTH_MODE=shim \
            -p 8000:8000 ingest-api
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8000/v1/healthz >/dev/null 2>&1; then
              echo "API answered healthz."; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' api)" != "true" ]; then
              echo "::error::The API container exited (code $(docker inspect -f '{{.State.ExitCode}}' api)). Logs:"
              docker logs api; exit 1
            fi
            sleep 2
          done
          echo "::error::The API container never answered healthz. Logs:"; docker logs api; exit 1

      - name: The worker container must stay up rather than crash-loop
        run: |
          docker run -d --name worker --add-host host.docker.internal:host-gateway \
            -e DATABASE_URL -e PLAN_SIGNING_SECRET ingest-worker
          sleep 15
          if [ "$(docker inspect -f '{{.State.Running}}' worker)" != "true" ]; then
            echo "::error::The worker container exited (code $(docker inspect -f '{{.State.ExitCode}}' worker)). Logs:"
            docker logs worker; exit 1
          fi
          # A container that is "running" while printing the same error forever is still broken, which is exactly
          # how this failure looked on the server.
          if docker logs worker 2>&1 | grep -qiE 'permission denied|traceback|failed to create directory'; then
            echo "::error::The worker is up but logging errors:"; docker logs worker; exit 1
          fi
          echo "Worker healthy."

      # The first deployment loaded its page perfectly while every API call from it was refused, because the
      # browser reaches the API at /api/v1/* and only the proxy makes that work. Booting the API alone cannot
      # catch that, so put a proxy in front of it and ask through the path the browser actually uses.
      - name: The API must answer on /api/v1 the way the browser reaches it
        run: |
          cat > /tmp/proxy.conf <<'CONF'
          server {
            listen 8080;
            location /api/ { proxy_pass http://api:8000/; }
          }
          CONF
          docker network create ingestci >/dev/null
          docker network connect ingestci api
          docker run -d --name proxy --network ingestci -p 8080:8080 \
            -v /tmp/proxy.conf:/etc/nginx/conf.d/default.conf:ro nginx:alpine
          ok=0
          for _ in $(seq 1 20); do
            body=$(curl -fsS --max-time 3 http://127.0.0.1:8080/api/v1/healthz 2>/dev/null || true)
            case "$body" in *'"status"'*) echo "Reached the API at /api/v1/healthz: $body"; ok=1; break;; esac
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::/api/v1/healthz did not return JSON through the proxy. The page would load and nothing in it would work."
            docker logs proxy 2>&1 | tail -20; docker logs api 2>&1 | tail -20; exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker logs api 2>&1 | tail -40 || true; docker logs worker 2>&1 | tail -40 || true
